<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Volyx Lens</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <header class="home-head">
    <div class="home-titlebar" aria-hidden="true"></div>
    <div class="home-hero">
      <div class="home-brand">
        <h1>Volyx Lens</h1>
        <span class="home-hint">Overlay: <kbd>⌘</kbd><kbd>\</kbd> show or hide</span>
      </div>
      <button id="home-start" class="home-start" type="button"><span class="home-start-dot" aria-hidden="true"></span><span id="home-start-label">Start Listening</span></button>
    </div>
    <input id="home-search" type="search" placeholder="Search sessions…" aria-label="Search sessions" autocomplete="off" spellcheck="false" />
  </header>
  <main id="home-list" aria-label="Sessions"></main>
  <script src="home.js"></script>
</body>
</html>
